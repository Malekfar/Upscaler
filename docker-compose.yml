services:
  upscaler:
    build:
      context: .
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu132
    image: upscaler:cuda
    ports:
      - "9090:7860"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      UPSCALER_TABS: ${UPSCALER_TABS-Color & Light}
      UPSCALER_API_OUTPUT_DIR: /data/api-output
    volumes:
      - weights:/data/weights
      - home:/home/app/.upscaler
      - api-output:/data/api-output
    restart: unless-stopped

volumes:
  api-output:
  weights:
  home:
