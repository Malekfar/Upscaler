<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>صف پردازش تصاویر</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#e8edf7;background:#101725}body{max-width:1200px;margin:auto;padding:32px 20px}h1{font-size:26px;margin-bottom:8px}p{color:#aab8cb;line-height:1.8}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin:24px 0}button{background:#273c59;color:white;border:1px solid #496487;border-radius:8px;padding:10px 18px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.panel{background:#182335;border:1px solid #304159;border-radius:12px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px;text-align:right}th,td{padding:16px 12px;border-bottom:1px solid #304159;vertical-align:top}th{color:#aab8cb;font-size:13px}td{font-size:14px}.id{font-family:monospace;direction:ltr;display:inline-block}.badge{border-radius:20px;background:#31435c;padding:5px 9px;white-space:nowrap}.completed{background:#164b3b}.failed{background:#713037}.processing{background:#215078}a{color:#91c9ff}.error{color:#ffabb1;white-space:pre-wrap;overflow-wrap:anywhere;max-width:360px;direction:auto}.footer{display:flex;align-items:center;gap:12px;margin-top:18px}.notice{color:#ffc2a8}
</style></head><body><h1>صف پردازش تصاویر</h1><p>درخواست‌ها به ترتیب ثبت، یکی پس از دیگری پردازش می‌شوند. این صفحه هر ۳ ثانیه به‌روز می‌شود.</p><div class="toolbar"><span id="summary">در حال دریافت اطلاعات…</span><button id="refresh">به‌روزرسانی</button></div><div id="notice" class="notice" role="alert"></div><div class="panel"><table><thead><tr><th>شناسه</th><th>وضعیت / نوبت</th><th>مرحله</th><th>زمان ثبت</th><th>نتیجه / خطا</th></tr></thead><tbody id="rows"></tbody></table></div><div class="footer"><button id="prev">جدیدتر</button><span id="page"></span><button id="next">قدیمی‌تر</button></div>
<script>
const labels={queued:'در صف',processing:'در حال پردازش',completed:'تکمیل شده',failed:'خطا',waiting:'در انتظار',loading:'خواندن تصویر',upscaling:'بزرگ‌نمایی',adjusting:'تنظیم تصویر',saving:'ذخیره‌سازی'};let offset=0;const limit=50;let busy=false;
function cell(row,text,cls){const td=document.createElement('td');if(cls)td.className=cls;td.textContent=text;row.appendChild(td);return td}
async function refresh(){if(busy)return;busy=true;try{const res=await fetch(`/api/jobs?limit=${limit}&offset=${offset}`,{cache:'no-store'});if(!res.ok)throw Error(`HTTP ${res.status}`);const data=await res.json();const body=document.querySelector('#rows');body.replaceChildren();for(const job of data.jobs){const tr=document.createElement('tr');const id=cell(tr,job.id);id.className='id';const state=cell(tr,'');const badge=document.createElement('span');badge.className='badge '+job.status;badge.textContent=(labels[job.status]||job.status)+(job.queue_position?' · '+job.queue_position:'');state.appendChild(badge);cell(tr,labels[job.stage]||job.stage);cell(tr,new Date(job.created_at).toLocaleString('fa-IR'));const result=cell(tr,'');if(job.error){result.className='error';result.textContent=job.error}else if(job.download_url){const link=document.createElement('a');link.href=job.download_url;link.textContent='دریافت تصویر';result.appendChild(link)}else result.textContent='—';body.appendChild(tr)}document.querySelector('#summary').textContent=`تعداد کل درخواست‌ها: ${data.total}`;document.querySelector('#page').textContent=`${data.total ? offset+1 : 0}–${Math.min(offset+limit,data.total)} از ${data.total}`;document.querySelector('#prev').disabled=offset===0;document.querySelector('#next').disabled=offset+limit>=data.total;document.querySelector('#notice').textContent=''}catch(e){document.querySelector('#notice').textContent='دریافت اطلاعات با خطا مواجه شد: '+e.message}finally{busy=false}}
document.querySelector('#refresh').onclick=refresh;document.querySelector('#prev').onclick=()=>{offset=Math.max(0,offset-limit);refresh()};document.querySelector('#next').onclick=()=>{offset+=limit;refresh()};refresh();setInterval(refresh,3000);
</script></body></html>
